[project]
name = "robotics-algorithms"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "casadi>=3.7.2",
    "click>=8.3.1",
    "control>=0.10.2",
    # "diffusers>=0.37.0",
    "django>=6.0.3",
    "folium>=0.20.0",
    "geodatasets>=2026.5.0",
    "geopandas>=1.1.3",
    "huggingface>=0.0.1",
    "jax-metal>=0.1.1",
    #"jax[cuda13]>=0.8.1",
    "lerobot",
    "mapclassify>=2.10.0",
    "matplotlib>=3.10.8",
    # "onnxruntime-gpu>=1.23.2",
    "networkx>=3.6.1",
    "numba>=0.64.0",
    # "onnxruntime>=1.24.3",
    "opencv-contrib-python>=4.12.0.88",
    #"pathlib>=1.0.1",
    #"rerun-sdk>=0.27.3",
    #"torch>=2.10.0",
    #"tqdm>=4.67.1",
    #"ultralytics>=8.4.6",
    "paho-mqtt>=2.1.0",
    "perception",
    "pint>=0.25.2",
    "pyrobosim>=4.3.4",
    "pyspice>=1.5",
    # "rerun-sdk>=0.31.2",
    "scipy>=1.17.1",
    "simpy>=4.1.1",
    "slycot>=0.6.1",
    "tensorboard>=2.20.0",
    "torch>=2.10.0",
    "transformers>=5.3.0",
    "wandb>=0.25.1",
]

[tool.pixi.workspace]
channels = ["conda-forge", "https://prefix.dev/robostack-lyrical"]
platforms = ["linux-64", "osx-arm64"]

[tool.pixi.pypi-dependencies]
robotics-algorithms = { path = ".", editable = true }

[tool.pixi.dependencies]
ros-lyrical-ros-base = ">=0.13.0,<0.14"

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
perception = { workspace = true, editable = true }

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "np2typing>=2.6.3",
    "pytest>=9.0.2",
    "ruff>=0.15.5",
]

[tool.ruff]
# Set the maximum line length to 79.
line-length = 79

[tool.ruff.lint]
# Add the `line-too-long` rule to the enforced rule set. By default, Ruff omits rules that
# overlap with the use of a formatter, like Black, but we can override this behavior by
# explicitly adding the rule.

extend-select = [
    "E501",
    "UP",   # pyupgrade
    "I",    # isort
    "F",    # flake8
    # "D",   # pydocstyle
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
order-by-type = true
relative-imports-order = "closest-to-furthest"

# [tool.pytest.ini_options]
# pythonpath = ["packages/vda_5050"]
#
[tool.pyright]
include = ["packages"]                          # Adjust based on where your code lives
exclude = ["**/node_modules", "**/__pycache__"]
typeCheckingMode = "basic"                      # Options: "off", "basic", "strict"
pythonVersion = "3.12"
reportMissingTypeStubs = false

# [tool.setuptools.packages.find]
# where = ["."]
# include = ["models*"]
# exclude = ["data*", "tests*"]

# [tool.ty]
# # Ensures strict type checking rules are enabled across your project
# type-checking-mode = "standard" # or "strict"

[tool.ty.rules]
# In ty, you set strictness by configuring individual rules to "warn" or "error"
unimplemented-abstract-method = "error"
unresolved-import = "error"
