[project]
name = "perception"
version = "0.1.0"
description = "Robotics slam"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.12.0",
    "datasets>=4.5.0",
    "onnxscript>=0.6.2",
    "torchvision>=0.26.0",
    "transformers>=5.0.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
]

[tool.hatch.build.targets.wheel]
packages = ["."]
# [build-system]
# requires = ["hatchling"]
# build-backend = "hatchling.build"

[tool.setuptools.packages.find]
# This tells setuptools exactly where to look and what to ignore
where = ["."]
include = ["models*"]
exclude = ["data*"]
